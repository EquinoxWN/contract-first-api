# Update pull requests are paused so the repository keeps a single main branch; CI audits dependencies on every push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # TypeSpec packages are released together and must stay on the same version.
      typespec:
        patterns: ["@typespec/*"]
      spectral:
        patterns: ["@stoplight/*"]
    ignore:
      # Node.js 24 is the supported runtime, so its type definitions stay on 24.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
